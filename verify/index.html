// ── Inline verifier (from dist/, single source) ──
const crypto_subtle = crypto.subtle;

async function sha256(input) {
  const data = new TextEncoder().encode(input);
  const hash = await crypto_subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}


function pyStringFormat(s) {
  let r = JSON.stringify(s);
  r = r.replace(/[\u0080-\uffff]/g, ch => '\\u' + ch.charCodeAt(0).toString(16).padStart(4, '0'));
  return r;
}

function pyNumberFormat(n) {
  if (Object.is(n, -0)) return "-0.0";
  if (!Number.isFinite(n)) return String(n);
  if (Number.isInteger(n) && Math.abs(n) < Number.MAX_SAFE_INTEGER) return n.toString();
  let best = JSON.stringify(n);
  for (let p = 17; p >= 1; p--) {
    const c = n.toPrecision(p);
    if (parseFloat(c) === n) best = c; else break;
  }
  if (best.includes('.') && !best.includes('e')) {
    best = best.replace(/0+$/, '');
    if (best.endsWith('.')) best += '0';
  }
  const abs = Math.abs(n);
  if (abs > 0 && abs < 1e-4 && !best.includes('e')) {
    const exp = Math.floor(Math.log10(abs));
    const m = n / Math.pow(10, exp);
    let mb = String(m);
    for (let p = 17; p >= 1; p--) {
      const mc = m.toPrecision(p);
      if (parseFloat(mc) * Math.pow(10, exp) === n) mb = mc; else break;
    }
    if (mb.includes('.')) mb = mb.replace(/0+$/, '').replace(/\.$/, '');
    best = mb + 'e-' + String(-exp).padStart(2, '0');
  }
  best = best.replace(/e([+-])(\d)$/, 'e$10$2');
  return best;
}

function _cv(val) {
  if (val === null || val === undefined) return 'null';
  if (typeof val === 'boolean') return val ? 'true' : 'false';
  if (typeof val === 'number') return pyNumberFormat(val);
  if (typeof val === 'string') return pyStringFormat(val);
  if (Array.isArray(val)) return '[' + val.map(_cv).join(',') + ']';
  if (typeof val === 'object') {
    const keys = Object.keys(val).sort();
    return '{' + keys.map(k => JSON.stringify(k) + ':' + _cv(val[k])).join(',') + '}';
  }
  return JSON.stringify(val);
}

function canonicalize(obj) { return _cv(obj); }

async function hashEntry02(entry) {
  const h = {
    version: entry.version, timestamp: entry.timestamp, event: entry.event,
    scaffoldType: entry.scaffoldType ?? null, depthLevel: entry.depthLevel ?? null,
    epistemicMode: entry.epistemicMode ?? null, triageResult: entry.triageResult ?? null,
    evidentialWeight: entry.evidentialWeight, priorPosterior: entry.priorPosterior,
    updatedPosterior: entry.updatedPosterior, nonInterventionDecision: entry.nonInterventionDecision ?? null,
  };
  let c = _cv(h);
  for (const f of ['evidentialWeight','priorPosterior','updatedPosterior']) {
    const v = h[f];
    if (typeof v === 'number' && Number.isInteger(v)) {
      c = c.replace(new RegExp('"' + f + '":(-?\\d+)(?=[,}\\]])'), '"' + f + '":$1.0');
    }
  }
  return await sha256(c);
}


const CHECKS=[
{id:'SCHEMA.REQUIRED',cat:'Schema',l:'Required fields present'},
{id:'SCHEMA.TYPES',cat:'Schema',l:'Field types valid'},
{id:'SCHEMA.TIMESTAMP_FORMAT',cat:'Schema',l:'Timestamp is ISO 8601'},
{id:'VERSION.MONOTONIC',cat:'Sequence',l:'Versions strictly increase'},
{id:'TIMESTAMP.MONOTONIC',cat:'Sequence',l:'Timestamps do not go backward'},
{id:'ENUM.VALID',cat:'Enums',l:'Enum values permitted'},
{id:'HASH.PREV_LINK',cat:'Hash chain',l:'Chain link valid'},
{id:'HASH.ENTRY_RECOMPUTE',cat:'Hash chain',l:'Entry hash recomputes'},
{id:'POSTERIOR.CHAIN',cat:'Posterior chain',l:'Posterior chain consistent'},
{id:'COMPACTION.BOUNDARY',cat:'Compaction',l:'Compaction boundary intact'},
];
const CATS=[...new Set(CHECKS.map(c=>c.cat))];
const VST=new Set(["none","socratic","probing","metacognitive","scaffolding","explain","hint","demonstrate"]);
const VDL=new Set(["surface","conceptual","transfer","integration"]);
const VEM=new Set(["experience","inference","analogy","testimony"]);
const VTR=new Set(["correct","slip","misconception","disengagement","ambiguous"]);

async function vr(rec){
  const vs=[];const V=(v,c,m,id)=>vs.push({version:v,category:c,message:m,checkId:id});
  if(!rec.studentScopeId)V(0,'schema','Missing studentScopeId','SCHEMA.REQUIRED');
  const es=rec.entries||[];const comp=rec.compactedBefore;
  let pv=comp?.version??0,ph=comp?.summaryHash??'',pts='',lu=null;
  const hasPosteriors=es.some(e=>typeof e.updatedPosterior==='number');
  for(const e of es){
    const v=e.version??-1;
    if(typeof v!=='number'||v<1)V(v,'schema','version must be positive','SCHEMA.REQUIRED');
    if(!e.timestamp)V(v,'schema','timestamp required','SCHEMA.REQUIRED');
    for(const f of['evidentialWeight','priorPosterior','updatedPosterior']){if(!(f in e))V(v,'schema',f+' must be a number','SCHEMA.REQUIRED');else if(typeof e[f]!=='number')V(v,'schema',f+' must be a number','SCHEMA.TYPES');}
    // SCHEMA.TYPES: checked per-field in the loop above
    const ts=e.timestamp||'';
    if(ts&&isNaN(new Date(ts).getTime()))V(v,'timestamp','Not ISO 8601','SCHEMA.TIMESTAMP_FORMAT');
    if(v<=pv)V(v,'version','Version '+v+' <= previous '+pv,'VERSION.MONOTONIC');
    if(pts&&ts){const pm=new Date(pts).getTime(),cm=new Date(ts).getTime();
      if(!isNaN(pm)&&!isNaN(cm)&&cm<pm-1000)V(v,'timestamp','Timestamp goes backward','TIMESTAMP.MONOTONIC');}
    if(e.scaffoldType&&!VST.has(e.scaffoldType))V(v,'enum','Invalid scaffoldType','ENUM.VALID');
    if(e.depthLevel&&!VDL.has(e.depthLevel))V(v,'enum','Invalid depthLevel','ENUM.VALID');
    if(e.epistemicMode&&!VEM.has(e.epistemicMode))V(v,'enum','Invalid epistemicMode','ENUM.VALID');
    if(e.triageResult&&!VTR.has(e.triageResult))V(v,'enum','Invalid triageResult','ENUM.VALID');
    if(e.prevHash!==ph)V(v,'hash','prevHash mismatch','HASH.PREV_LINK');
    const ch=await hashEntry02(e);
    if(e.entryHash!==ch)V(v,'hash','entryHash mismatch','HASH.ENTRY_RECOMPUTE');
    if(lu!==null&&typeof e.priorPosterior==='number'&&Math.abs(e.priorPosterior-lu)>1e-9)
      V(v,'posterior','priorPosterior ('+e.priorPosterior+') != previous updatedPosterior ('+lu+')','POSTERIOR.CHAIN');
    pv=v;pts=ts;ph=e.entryHash;if(typeof e.updatedPosterior==='number')lu=e.updatedPosterior;
  }
  return{valid:vs.length===0,violations:vs,entriesChecked:es.length,hasCompaction:!!comp,hasPosteriors};
}

let mode='t',lr=null,lrec=null;
function sm(m){mode=m;document.getElementById('mt').className='tb'+(m==='t'?' on':'');
document.getElementById('mp').className='tb'+(m==='p'?' on':'');if(lr)render(lrec,lr);}

function render(rec,r){lr=r;lrec=rec;const el=document.getElementById('res');
const sid=rec.studentScopeId||'?',sv=rec.schemaVersion||'0.2',n=(rec.entries||[]).length;
const vbc=r.violations.reduce((a,v)=>{(a[v.checkId]??=[]).push(v);return a;},{});
let h='<div class="rh"><h2>record '+sid+'</h2><div class="rm">schema '+sv+', '+n+' entries</div></div>';
for(const cat of CATS){h+='<div class="gl">'+cat+'</div>';
for(const ck of CHECKS.filter(c=>c.cat===cat)){const vl=vbc[ck.id]||[];
if(ck.id==='COMPACTION.BOUNDARY'&&!r.hasCompaction)h+='<div class="cr"><span class="ci n">&ndash;</span>'+ck.l+' <span style="color:#9CA3AF">(not applicable)</span></div>';
else if(ck.id==='POSTERIOR.CHAIN'&&!r.hasPosteriors)h+='<div class="cr"><span class="ci n">&ndash;</span>'+ck.l+' <span style="color:#9CA3AF">(not applicable)</span></div>';
else if(vl.length)h+='<div class="cr"><span class="ci f">&times;</span>'+ck.l+' <span style="color:#9CA3AF;font-size:11px">('+vl.length+' failure'+(vl.length>1?'s':'')+'; first at v'+vl[0].version+': '+vl[0].message+')</span></div>';
else h+='<div class="cr"><span class="ci p">&check;</span>'+ck.l+'</div>';}}
if(r.valid)h+='<div class="vb vc">VERDICT: CLEAN &mdash; record is verifiable</div>';
else h+='<div class="vb vd">VERDICT: NOT CLEAN &mdash; '+r.violations.length+' violation(s)</div>';
h+='<div class="cav">'+(mode==='p'?
'This file holds '+n+' recorded interactions. '+(r.valid?'It was not changed after it was written.':'It was changed: '+r.violations.length+' entries do not match.')+' It does not say whether the learner learned. No record can.':
'A clean verdict means this record was not altered, its entries are in order, and its fields are well-formed. It does not mean the estimates are accurate or that the tool is effective. The verifier checks the record, not the claim.')+'</div>';
el.innerHTML=h;el.style.display='block';}

async function ls(name){document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
event.target.classList.add('on');const rec=JSON.parse(SAMPLES[name]);render(rec,await vr(rec));}
async function hf(text){try{const obj=JSON.parse(text.trim());
if(!obj.entries&&!obj.evidence){document.getElementById('res').innerHTML='<div class="rh"><h2>Not a record</h2><div class="rm">A record needs studentScopeId and entries. Try a sample above.</div></div>';document.getElementById('res').style.display='block';return;}
render(obj,await vr(obj));}catch(e){document.getElementById('res').innerHTML='<div class="rh"><h2>Parse error</h2><div class="rm">'+e.message+'</div></div>';document.getElementById('res').style.display='block';}}
const dz=document.getElementById('dz');
dz.addEventListener('dragover',e=>{e.preventDefault();dz.classList.add('over');});
dz.addEventListener('dragleave',()=>dz.classList.remove('over'));
dz.addEventListener('drop',e=>{e.preventDefault();dz.classList.remove('over');const f=e.dataTransfer.files[0];if(f)f.text().then(hf);});
document.getElementById('fi').addEventListener('change',e=>{const f=e.target.files[0];if(f)f.text().then(hf);});
</script>
