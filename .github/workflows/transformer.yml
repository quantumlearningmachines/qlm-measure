name: transformer and Airflow
on:
  pull_request:
    paths: ['tools/qlm-transformer/**', 'integrations/airflow/**', 'demo/transformer/**', '.github/workflows/transformer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  packages-and-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install ./tools/qlm-transformer ./integrations/airflow build
      - run: python -m unittest discover -s tools/qlm-transformer/tests -v
      - run: python -m unittest discover -s tools/qlm-transformer/qlm_transformer/capture/reference/analysis -v
      - run: python -m unittest discover -s tools/qlm-transformer/qlm_transformer/capture/reference/analysis/vendor_contract -v
      - run: python -m unittest discover -s tools/qlm-transformer/qlm_transformer/capture/reference/sql_analysis -v
      - run: python -m unittest discover -s integrations/airflow/tests -v
      - run: python integrations/airflow/build_download.py
      - run: python demo/transformer/scripts/build_release_assets.py
      - run: node --test demo/transformer/tests/*.test.mjs
      - run: python -m build tools/qlm-transformer
      - run: python -m build integrations/airflow
      - name: Install built distributions outside the checkout
        run: |
          mkdir -p /tmp/qlm-distributions
          cp tools/qlm-transformer/dist/* integrations/airflow/dist/* /tmp/qlm-distributions/
          python tools/qlm-transformer/scripts/verify_distributions.py --dist-dir /tmp/qlm-distributions --airflow-zip demo/transformer/dist/downloads/qlm-transformer-airflow.zip
  airflow:
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: /tmp/qlm-transformer-airflow-ci
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/integrations/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
      QLM_PIPELINE_ROOT: ${{ github.workspace }}/integrations/airflow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'apache-airflow==3.3.2' --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.12.txt
      - run: python -m pip install 'apache-airflow==3.3.2' ./tools/qlm-transformer ./integrations/airflow --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.12.txt
      - run: python -m pip check
      - run: airflow db migrate
      - name: Execute capture DAG with local development services
        run: airflow dags test learnlog_recorded_requests 2026-10-20
      - name: Execute transcript DAG with an ephemeral pseudonym key
        run: |
          export QLM_PSEUDONYM_KEY_B64="$(python -c 'import base64,secrets; print(base64.b64encode(secrets.token_bytes(32)).decode())')"
          airflow dags test qlm_transformer_exports 2026-10-20
