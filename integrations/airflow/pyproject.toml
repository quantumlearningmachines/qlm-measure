[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qlm-transformer-airflow-demo"
version = "0.5.0rc1"
description = "Apache Airflow workflows for native research exports and assistance capture analysis"
requires-python = ">=3.12"
dependencies = ["qlm-transformer==0.3.0rc1", "jsonschema==4.26.0"]
license = "MIT"

[project.scripts]
qlm-pipeline = "qlm_airflow.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qlm_airflow = ["resources/*.json"]
